model: claude-sonnet-5-5

author:
  name: Guha
  role: Senior Full Stack Developer (React, TypeScript, Next.js, Python, GenAI)
  voice: >
    Practical, clear and friendly. Shares hands-on lessons from building real products.
    Explains concepts simply, avoids hype.

post:
  min_chars: 700       # your target range
  max_chars: 3000      # LinkedIn allows 3000; ~1300 reads best on mobile
  hashtags: 3
  min_emojis: 3        # meaningful emojis sprinkled across the post
  max_emojis: 7

review:
  min_score: 4         # every review criterion must score >= 4 out of 5
  max_attempts: 3      # each attempt uses a different source; after 3, nothing is posted
  passes: 3            # independent editorial reviews, all must pass, plus one fact-check

infographic:
  bg: "#FFFFFF"
  card: "#F2F5FA"
  ink: "#111827"
  muted: "#4B5563"
  accent: "#0A66C2"
  footer: "Guha | Full Stack & GenAI"

linkedin:
  api_version: "202510"   # YYYYMM; LinkedIn supports roughly the last 12 months

telegram:
  timeout_hours: 3          # wait this long for your Approve/Reject, then skip the day
  remind_every_minutes: 20  # ping you on Telegram until you answer

research:
  search_tool: web_search_20250305   # Anthropic web search tool version
  pick: random_source       # each run browses one allowed source chosen at random
  max_age_days: 7           # only items published in the last 7 days
  skip_recent_days: 3       # don't use the same source again within 3 days
  must_cite: true           # every factual claim must come from a source it read
  allowed_domains:          # domains only (no paths). Official vendors, standards and advisories
    - react.dev
    - nextjs.org
    - typescriptlang.org
    - nodejs.org
    - python.org
    - fastapi.tiangolo.com
    - flask.palletsprojects.com
    - djangoproject.com
    - pydantic.dev
    - expressjs.com
    - deno.com
    - bun.sh
    - vuejs.org
    - svelte.dev
    - angular.dev
    - tailwindcss.com
    - developer.mozilla.org
    - web.dev
    - developer.chrome.com
    - openai.com
    - anthropic.com
    - huggingface.co
    - langchain.com
    - deeplearning.ai
    - arxiv.org
    - developers.googleblog.com
    - devblogs.microsoft.com
    - blog.cloudflare.com
    - github.blog
    - aws.amazon.com
    - cloud.google.com
    - docker.com
    - kubernetes.io
    - owasp.org
    - nvd.nist.gov
    - cisa.gov
    - portswigger.net
