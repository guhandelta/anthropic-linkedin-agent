name: Daily LinkedIn post

on:
  schedule:
    # Option A (Once a day): 9:15 AM EDT (13:15 UTC) Monday - Sunday
    - cron: "15 13 * * *"
     timezone: "America/New_York"
    # Option B (Twice a day): Uncomment the line below for 9:15 AM & 5:15 PM EDT (13:15 & 21:15 UTC)
    # - cron: "15 13,21 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "Optional custom topic (leave empty for autonomous AI research)"
        required: false
        default: ""

permissions:
  contents: write            # to commit posted.json back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240     # up to 4 hours waiting for your Telegram approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-dejavu-core fonts-noto-color-emoji libcairo2
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LI_AT: ${{ secrets.LI_AT }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python agent.py --topic "${{ github.event.inputs.topic }}"
          else
            python agent.py
          fi
      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
      - name: Commit post log
        if: success()
        run: |
          git config user.name "linkedin-agent"
          git config user.email "agent@users.noreply.github.com"
          git add posted.json
          git commit -m "Log daily post" || echo "nothing to commit"
          git push
