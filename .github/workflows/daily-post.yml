# ==============================================================================
# GitHub Actions Automation: Daily LinkedIn Post Pipeline
# ==============================================================================
# This workflow runs the autonomous LinkedIn Agent on GitHub's free runners.
#
# Execution Flow:
#   1. Cron Trigger: Runs automatically every morning (9:15 AM America/New_York).
#   2. Manual Trigger (workflow_dispatch): Allows on-demand runs with optional custom topics.
#   3. Research & Drafting: Discovers fresh documentation and synthesizes practitioner post.
#   4. Infographic Rendering: CairoSVG + libcairo2 + Chromium renders 1080x1350 SVG/GIF.
#   5. Telegram Review Gate: Sends interactive card to user; runner holds open for approval.
#   6. Publish & Commit: Posts to LinkedIn Wall & Groups, then commits history to repo.
# ==============================================================================
name: Daily LinkedIn post

on:
  schedule:
    # Run daily at 10:00 New York time. Scheduled runs always publish, even if a post already went out that day.
    # The timezone key makes GitHub follow New York time, so the run stays at 10:00 through EST/EDT changes.
    - cron: "0 10 * * *"
      timezone: "America/New_York"

  # Manual on-demand execution via GitHub Web UI
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional custom topic (leave empty to pick from 3 suggested topics on Telegram)"
        required: false
        default: ""
      run_mode:
        description: "Manual runs: check fallback, generate without publishing, publish, or publish your own text"
        required: true
        type: choice
        default: fallback-check
        options:
          - fallback-check
          - dry-run
          - publish
          - direct
          - groups-check
      post_text:
        description: "direct mode only: the post text to publish (the Telegram inbox check fills this)"
        required: false
        default: ""

permissions:
  contents: write            # Required to commit updated posted.json and topic_history.json

# Concurrency group ensures only one editorial review session runs at a time
concurrency:
  group: linkedin-editorial-session
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Waits on Telegram: topic pick 60 min + text approval 120 min + final OK 60 min, plus the
    # work in between. GitHub-hosted jobs are capped at 360 minutes.
    timeout-minutes: 350

    steps:
      # Step 1: Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history so the history commit can rebase onto newer main

      - name: Validate publish credentials
        if: github.event_name == 'schedule' || inputs.run_mode == 'publish' || inputs.run_mode == 'direct'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LI_AT: ${{ secrets.LI_AT }}
        run: |
          for name in LINKEDIN_ACCESS_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID LI_AT; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name" >&2; exit 1; fi
          done
          if [ -z "${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${OPEN_AI_API_KEY}${GOOGLE_API_KEY}${GEMINI_API_KEY}" ]; then
            echo "At least one AI provider key is required" >&2
            exit 1
          fi

      # Step 2: Set up Python 3.12 runtime
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Step 3: Install system dependencies for CairoSVG rendering (libcairo2 and clean fonts)
      - name: Install System Graphics & Font Libraries
        run: sudo apt-get install -y fonts-dejavu-core fonts-noto-color-emoji libcairo2

      # Step 4: Install Python requirements
      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # Step 5: Install Playwright and Chromium browser binary for LinkedIn group posting
      - name: Install Playwright & Chromium
        run: playwright install --with-deps chromium

      # Step 6: Execute the autonomous agent pipeline
      - name: Run LinkedIn Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LI_AT: ${{ secrets.LI_AT }}
          TOPIC: ${{ inputs.topic }}
          RUN_MODE: ${{ inputs.run_mode }}
          POST_TEXT: ${{ inputs.post_text }}
          PYTHONUNBUFFERED: "1"         # log lines with their real times
          # LinkedIn logs the owner out when LI_AT is used from a GitHub server, so groups are skipped here.
          POST_TO_GROUPS: "false"
          # The three waits must fit the job's 350-minute timeout with time left for the work.
          TELEGRAM_TOPIC_WAIT_MINUTES: "60"
          TELEGRAM_TEXT_WAIT_MINUTES: "120"
          TELEGRAM_TIMEOUT_HOURS: "1"
        run: |
          case "${RUN_MODE:-publish}" in
            fallback-check)
              python scripts/check_fallback.py
              ;;
            dry-run)
              args=(--dry-run)
              if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
              python agent.py "${args[@]}"
              ;;
            publish)
              # Topic picked on Telegram (or given), text approved, then infographic, then posted
              args=(--interactive)
              if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
              python agent.py "${args[@]}"
              ;;
            direct)
              if [ -z "$POST_TEXT" ]; then echo "direct mode needs post_text" >&2; exit 2; fi
              python agent.py --interactive --direct "$POST_TEXT"
              ;;
            groups-check)
              # Posts nothing: checks that LinkedIn accepts LI_AT and shows the first group's post box
              python linkedin_groups.py --check-groups
              ;;
            *)
              echo "Unknown run mode: $RUN_MODE" >&2
              exit 2
              ;;
          esac

      # Step 7: Upload generated SVGs, GIFs, and review logs as build artifacts
      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: output
          path: output/
          if-no-files-found: ignore

      # Step 8: Commit updated publication logs and topic history back to remote git repo
      - name: Commit Post & Topic History
        if: success() && (github.event_name == 'schedule' || inputs.run_mode == 'publish' || inputs.run_mode == 'direct')
        run: |
          git config user.name "linkedin-agent"
          git config user.email "agent@users.noreply.github.com"
          # Save only the history files onto the latest main. A run started from a PR branch must
          # never push that branch's code to main, and main may have moved during the approval wait.
          keep="$RUNNER_TEMP/history"
          mkdir -p "$keep/state"
          cp posted.json topic_history.json scripts/merge_history.py "$keep/"
          if [ -f state/poster_style.json ]; then cp state/poster_style.json "$keep/state/"; fi
          for attempt in 1 2 3 4; do
            git fetch origin main && git checkout -f -B history-update origin/main
            # Keep main's entries and add this run's new ones (a git merge of two lists conflicts)
            python "$keep/merge_history.py" "$keep" .
            git add posted.json topic_history.json
            # Poster history keeps every post's layout and colours different across runs
            if [ -f "$keep/state/poster_style.json" ]; then
              mkdir -p state && cp "$keep/state/poster_style.json" state/ && git add state/poster_style.json
            fi
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "Log editorial activity [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the post history after 4 attempts." >&2
          exit 1
